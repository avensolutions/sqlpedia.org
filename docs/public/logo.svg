<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- SQLpedia Logo -->
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3c8772;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5fb59a;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Database cylinder -->
  <ellipse cx="50" cy="30" rx="30" ry="10" fill="url(#gradient)" opacity="0.8"/>
  <rect x="20" y="30" width="60" height="40" fill="url(#gradient)" opacity="0.9"/>
  <ellipse cx="50" cy="70" rx="30" ry="10" fill="url(#gradient)"/>

  <!-- Lines representing data -->
  <line x1="30" y1="40" x2="70" y2="40" stroke="white" stroke-width="2" opacity="0.7"/>
  <line x1="30" y1="50" x2="70" y2="50" stroke="white" stroke-width="2" opacity="0.7"/>
  <line x1="30" y1="60" x2="70" y2="60" stroke="white" stroke-width="2" opacity="0.7"/>

  <!-- SQL text indicator -->
  <text x="50" y="90" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#3c8772" text-anchor="middle">SQL</text>
</svg>
