[build]
  publish = "docs/.vitepress/dist"
  command = "npm run build"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "24"

# Canonical domain: 301-redirect all other hostnames to https://sqlpedia.org.
# Listed before the /api rewrite so canonicalization happens first.
[[redirects]]
  from = "https://www.sqlpedia.org/*"
  to = "https://sqlpedia.org/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://sqlpedia.com/*"
  to = "https://sqlpedia.org/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.sqlpedia.com/*"
  to = "https://sqlpedia.org/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://sqlpedia.net/*"
  to = "https://sqlpedia.org/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.sqlpedia.net/*"
  to = "https://sqlpedia.org/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Environment variables (set these in Netlify UI -> Site settings -> Environment variables)
# GEMINI_API_KEY          = "key from a no-billing Google project"
# TURNSTILE_SECRET_KEY    = "Cloudflare Turnstile secret key"
# VITE_TURNSTILE_SITE_KEY = "Cloudflare Turnstile site key (public, build-time)"
# SLACK_WEBHOOK_URL       = "Slack incoming webhook for usage alerts"
# DAILY_REQUEST_LIMIT     = "soft daily budget for alerting, e.g. 1000"
# ALERT_THRESHOLD_PCT     = "percent of budget for first alert, e.g. 80"
# ALLOWED_ORIGINS         = "https://sqlpedia.org,https://www.sqlpedia.org"
